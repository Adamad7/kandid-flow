name: Backend CI (Docker)

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - "backend/**"
      - "docker-compose*.yml"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "main", "master", "develop" ]
    paths:
      - "backend/**"
      - "docker-compose*.yml"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Migrations & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker compose build backend

      - name: Run Ruff Linter inside Docker
        run: docker compose run --rm backend ruff check .

      - name: Run Ruff Formatter Check inside Docker
        run: docker compose run --rm backend ruff format --check .

      - name: Start PostgreSQL Service
        run: |
          docker compose up -d db
          # Wait for healthy database
          timeout 30s sh -c 'until docker compose exec db pg_isready -U kandid_user -d kandid_db; do sleep 1; done'

      - name: Apply Alembic Migrations inside Docker
        run: docker compose run --rm backend alembic upgrade head

      - name: Run Pytest Test Suite inside Docker
        run: docker compose run --rm backend pytest

      - name: Clean up Docker containers
        if: always()
        run: docker compose down -v
